name: Express Money Transfer — Docker Build & DevSecOps

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel an in-progress run on the same branch when a newer commit is pushed
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# -------------------------------------------------
# GLOBAL VARIABLES
# -------------------------------------------------
env:
  REGISTRY: ghcr.io
  DOCKERFILE_PATH: ./Dockerfile

jobs:
  # -------------------------------------------------
  # JOB: Build, Scan and Push Docker Image
  # -------------------------------------------------
  build-scan-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest

    # GITHUB_TOKEN needs write access to packages to push to GHCR
    permissions:
      contents: read
      packages: write

    steps:
      # -------------------------------------------------
      # STEP 1: Checkout Repository
      # -------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v5

      # -------------------------------------------------
      # STEP 2: Setup Docker Buildx
      # -------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------
      # STEP 3: Login to GitHub Container Registry
      # -------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------
      # STEP 4: Generate Image Name & Tag (Commit SHA)
      # -------------------------------------------------
      # Registry image names must be lowercase, but the repo owner (MikeyA-yo) is not
      - name: Generate Image Name & Tag
        id: tag
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------
      # STEP 5: Build Docker Image (load locally, do not push yet)
      # -------------------------------------------------
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: false
          load: true
          tags: |
            ${{ steps.tag.outputs.IMAGE }}:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ steps.tag.outputs.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------
      # STEP 6: Install Trivy Security Scanner
      # -------------------------------------------------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      # -------------------------------------------------
      # STEP 7: Scan Docker Image for Vulnerabilities
      # -------------------------------------------------
      # --exit-code 0 reports findings without failing the build.
      # Change to 1 to block the push when HIGH/CRITICAL issues are found.
      - name: Scan Docker Image for Vulnerabilities
        run: |
          trivy image \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --format table \
            --output trivy-report.txt \
            ${{ steps.tag.outputs.IMAGE }}:${{ steps.tag.outputs.IMAGE_TAG }}

      # Show the report in the run summary so it can be read without downloading it
      - name: Add Scan Report to Job Summary
        if: always()
        run: |
          echo "## Trivy Scan — HIGH & CRITICAL" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-report.txt >> "$GITHUB_STEP_SUMMARY" || echo "No report generated" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------
      # STEP 8: Upload Scan Report
      # -------------------------------------------------
      - name: Upload Trivy Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 7

      # -------------------------------------------------
      # STEP 9: Push Docker Image to GitHub Container Registry
      # -------------------------------------------------
      # Pushes the exact image that was scanned above, instead of rebuilding it
      - name: Push Docker Image to GHCR
        run: docker push --all-tags ${{ steps.tag.outputs.IMAGE }}
